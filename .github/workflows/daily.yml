name: Daily threat pack

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threat-pack
  cancel-in-progress: false

env:
  # Fingerprint of the OFFLINE update key that signed delegation.json. Public information.
  UPDATE_KEY_FINGERPRINT: "bb032af71942ec61c7e538bd15177ed3"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The tool below is committed as binaries and runs while the signing key is on disk.
      # Refuse to run it unless every file matches the pinned hash, so a swapped DLL fails the run.
      # When you rebuild the tool on purpose, update these hashes in the same commit.
      - name: Verify the committed tool binaries
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/tool.sha256" <<'SUMS'
          ef92fc661e8d7ba8ec4d39a7cdfcdba41f14cb327f0d24fe79d0b5bb428899b5  tool/BouncyCastle.Cryptography.dll
          afb9f679f9a7fa4a8c034ff07fb1da0bdc43f70c14d1db18d30c4594d2ee00bb  tool/Citadel.Core.dll
          b44832a0f28bc2604a2e38b846f6477971a483eba7a0bf0dfac05796bd7574b5  tool/PackTool.dll
          SUMS
          sed -i 's/^ *//' "$RUNNER_TEMP/tool.sha256"
          sha256sum -c "$RUNNER_TEMP/tool.sha256"

      - name: Research new indicators
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet "anthropic>=0.40,<1"
          python research/research.py research/proposal.json

      - name: Merge under the guardrails, sign, verify
        env:
          PACK_KEY_JSON: ${{ secrets.PACK_KEY_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PACK_KEY_JSON" > "$RUNNER_TEMP/pack-key.json"
          dotnet tool/PackTool.dll --merge-pack --prev threat-pack.json --proposal research/proposal.json \
            --pack-key "$RUNNER_TEMP/pack-key.json" --delegation delegation.json --out threat-pack.new.json | tee research/last-run.txt
          rm -f "$RUNNER_TEMP/pack-key.json"
          dotnet tool/PackTool.dll --verify-pack threat-pack.new.json --fingerprint "$UPDATE_KEY_FINGERPRINT"
          mv threat-pack.new.json threat-pack.json

      - name: Publish
        run: |
          git config user.name "citadel-threat-pack"
          git config user.email "citadel-threat-pack@users.noreply.github.com"
          git add threat-pack.json research/last-run.txt
          git commit -m "Threat pack $(date -u +%Y-%m-%d)" || exit 0
          git push
